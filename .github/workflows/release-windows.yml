name: Build & Release Windows Setup

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: false
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      HAS_SIGNING_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build React/Tailwind UI (frontend/ui_dist)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup Python 3.13 (matches local .venv)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt pyinstaller

      - name: Run unit & API integration tests
        run: |
          pytest -v

      - name: Smoke test Windows frozen prerequisites
        run: |
          python -c "import webview, pythonnet, clr_loader, sqlite_vec, hwpx, pdfplumber, pypdfium2, docx; from google import genai; print('Imports OK')"
          python -m app.main --smoke-check

      - name: Package with PyInstaller (--onedir)
        run: |
          python -m PyInstaller app.spec --clean --noconfirm

      - name: Verify built SocialBidAI.exe exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/SocialBidAI/SocialBidAI.exe")) {
            throw "SocialBidAI.exe was not generated"
          }

      - name: Smoke test the frozen exe (Live-mode imports included)
        shell: pwsh
        run: |
          $env:SOCIALBID_DATA_DIR = Join-Path $env:RUNNER_TEMP "socialbid-smoke"
          $p = Start-Process -FilePath "dist/SocialBidAI/SocialBidAI.exe" -ArgumentList "--smoke-check" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Frozen exe smoke check failed (exit $($p.ExitCode))" }

      # 코드 서명(선택): 저장소 Secrets에 WINDOWS_CERT_PFX_BASE64·WINDOWS_CERT_PASSWORD를 등록하면 서명한다.
      # 미등록 시 건너뛰며, 서명 없는 setup.exe는 SmartScreen 경고가 표시된다.
      - name: Sign SocialBidAI.exe (optional)
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        shell: pwsh
        run: ./installer/sign.ps1 -Files "dist/SocialBidAI/SocialBidAI.exe"

      - name: Download WebView2 Evergreen Bootstrapper
        shell: pwsh
        run: |
          $out = "installer/MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $out
          # 설치 파일에 동봉하기 전에 Microsoft Authenticode 서명 확인(변조·리다이렉트 오염 차단)
          $sig = Get-AuthenticodeSignature -FilePath $out
          if ($sig.Status -ne "Valid") { throw "WebView2 bootstrapper signature is not valid: $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") {
            throw "Unexpected WebView2 bootstrapper signer: $($sig.SignerCertificate.Subject)"
          }
          Write-Host "WebView2 bootstrapper signed by: $($sig.SignerCertificate.Subject)"

      - name: Determine version & Compile Inno Setup installer
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $ref = "${{ github.ref_name }}"
            if ($ref -match "^v(.+)$") { $ver = $Matches[1] } else { $ver = "0.1.0" }
          }
          $iscc = (Get-Command "iscc.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source)
          if (-not $iscc) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DMyAppVersion=$ver" "installer/setup.iss"

      - name: Sign setup.exe (optional)
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        shell: pwsh
        run: ./installer/sign.ps1 -Files (Get-ChildItem "dist/installer/*.exe").FullName

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-FileHash -Path "dist/installer/*.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } |
            Out-File -FilePath "dist/installer/SHA256SUMS.txt" -Encoding utf8
          Get-Content "dist/installer/SHA256SUMS.txt"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SocialBidAI-Windows-Setup
          path: |
            dist/installer/*.exe
            dist/installer/SHA256SUMS.txt

      - name: Attach setup.exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/installer/*.exe
            dist/installer/SHA256SUMS.txt
